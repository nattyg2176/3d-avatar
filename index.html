<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI Avatar Chat Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <canvas id="three-canvas"></canvas>
        
        <div id="chat-container">
            <div id="chat-header">
                <h3>Chat with AI Avatar</h3>
            </div>
            <div id="chat-messages"></div>
            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type your message..." />
                <button id="send-button">Send</button>
            </div>
        </div>

        <div id="api-key-prompt" class="modal">
            <div class="modal-content">
                <h2>OpenAI API Key Required</h2>
                <p>Please enter your OpenAI API key to chat with the avatar.</p>
                <p class="warning">⚠️ Note: This key will be used client-side. For production, use a backend server.</p>
                <input type="password" id="api-key-input" placeholder="sk-..." />
                <button id="api-key-submit">Start Chatting</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/avatar.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
